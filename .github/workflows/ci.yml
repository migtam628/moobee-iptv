name: MooBee CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Syntax validation
        run: python -m compileall -q app
      - name: Run tests
        run: pytest -q
      - name: Dockerfile and Compose validation
        run: |
          docker compose --env-file .env.example config --quiet
          docker build -t moobee-ci .
